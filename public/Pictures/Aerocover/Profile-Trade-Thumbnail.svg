<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Long, shallow aerocover envelope on a rocket body</title><desc id="desc">Illustrative side silhouette with 63-inch length and 1.6-inch height, a 39.375-to-1 ratio, shown above an 8-inch rocket body. Final leading and aft contours are under study.</desc>
<defs><linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f0f0"/><stop offset=".45" stop-color="#babdc2"/><stop offset="1" stop-color="#666b73"/></linearGradient><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#33373c"/><stop offset=".35" stop-color="#202327"/><stop offset="1" stop-color="#111214"/></linearGradient></defs>
<rect width="1200" height="700" fill="#101010"/>
<g font-family="Arial,sans-serif"><text x="78" y="102" font-size="44" fill="#eee" letter-spacing="3">AEROCOVER</text><text x="78" y="148" font-size="26" fill="#aaa">Long, shallow fairing on the rocket surface</text></g>
<g transform="rotate(-12 600 360)">
<path d="M65 373.15873H1140V503.95238H65Z" fill="url(#body)"/>
<path d="M65 373.15873H1140" fill="none" stroke="#61666d" stroke-width="1.5"/>
<!-- Envelope: length 1030 units / height 26.15873 units = 63 / 1.6. Contours illustrative. -->
<path d="M90 373.15873C135 372 185 347 245 347H1025C1065 347 1090 355 1120 373.15873Z" fill="url(#cover)" stroke="#dedfe1" stroke-width="1.5"/>
<path d="M90 373.15873C135 372 185 347 245 347H1025C1065 347 1090 355 1120 373.15873" fill="none" stroke="#e63946" stroke-width="3"/>
</g>
<g font-family="Arial,sans-serif"><text x="78" y="604" font-size="32" fill="#ddd">63 in long / 1.6 in tall</text><text x="78" y="650" font-size="24" fill="#999">Illustrative envelope · final profile under study</text></g></svg>